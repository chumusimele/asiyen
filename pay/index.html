<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asiyen - Pay your fare</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1B5E20;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 360px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    p {
      color: #c8e6c9;
      font-size: 15px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: white;
      color: #1B5E20;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      margin-top: 24px;
    }
    .spinner {
      margin: 24px auto;
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .stores {
      margin-top: 32px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .stores a {
      background: black;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="margin:0 0 8px;">
      <!-- The Asiyen mark at the sticker's proportions; same numbers as the
           site's #asiyen-mark and the app's AsiyenWordmark. -->
      <svg viewBox="0 -25 820 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Asiyen" style="height:40px;width:auto;display:block;margin:0 auto;">
        <g fill="none" stroke-width="26.1" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13.05,-11.8 70.75,50 13.05,111.8" stroke="#66BB6A"/>
          <polyline points="87.25,-11.8 144.95,50 87.25,111.8" stroke="#E7A64C"/>
          <polyline points="161.45,-11.8 219.15,50 161.45,111.8" stroke="#FFFFFF"/>
        </g>
        <text x="276.15" y="100" fill="#FFFFFF" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-weight="700" font-size="139.66">ASIYEN</text>
      </svg>
    </h1>
    <p>Opening the app to complete your payment...</p>
    <div class="spinner"></div>
    <p id="fallback-text" style="display:none;">
      Don't have Asiyen yet? It's coming soon.
    </p>
    <div class="stores" id="store-links" style="display:none;">
      <!-- Not a link until the Play listing is live. -->
      <span style="background:black;color:white;padding:10px 16px;border-radius:8px;font-size:13px;">Coming soon to Google Play</span>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sticker = params.get('sticker');

    if (sticker) {
      window.location.href = 'asiyen://pay?sticker=' + encodeURIComponent(sticker);
    }

    setTimeout(function () {
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('p').textContent = 'Asiyen app not detected on this device.';
      document.getElementById('fallback-text').style.display = 'block';
      document.getElementById('store-links').style.display = 'flex';
    }, 1500);
  </script>
</body>
</html>
