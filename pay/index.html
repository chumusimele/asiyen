<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asiyen - Pay your fare</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1B5E20;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 360px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    p {
      color: #c8e6c9;
      font-size: 15px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: white;
      color: #1B5E20;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      margin-top: 24px;
    }
    .spinner {
      margin: 24px auto;
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .stores {
      margin-top: 32px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .stores a {
      background: black;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ASIYEN</h1>
    <p>Opening the app to complete your payment...</p>
    <div class="spinner"></div>
    <p id="fallback-text" style="display:none;">
      Don't have Asiyen installed yet? Download it below to scan and pay.
    </p>
    <div class="stores" id="store-links" style="display:none;">
      <a href="https://play.google.com/store/apps/details?id=com.asiyen.app">Google Play</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sticker = params.get('sticker');

    if (sticker) {
      window.location.href = 'asiyen://pay?sticker=' + encodeURIComponent(sticker);
    }

    setTimeout(function () {
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('p').textContent = 'Asiyen app not detected on this device.';
      document.getElementById('fallback-text').style.display = 'block';
      document.getElementById('store-links').style.display = 'flex';
    }, 1500);
  </script>
</body>
</html>
